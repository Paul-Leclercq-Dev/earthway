name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  backend-ci:
    name: Backend - install lint test build prisma
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EarthwayBack

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: earthway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d earthway_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/earthway_test?schema=public
      SECRET_KEY: ci_test_access_secret
      REFRESH_SECRET_KEY: ci_test_refresh_secret
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      GOOGLE_CLIENT_ID: dummy-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_HOST: smtp.example.com
      MAIL_USER: test@example.com
      MAIL_PASSWORD: dummy-password
      MAIL_FROM: noreply@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EarthwayBack/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

  frontend-ci:
    name: Frontend - install lint test build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EarthwayFront

    env:
      VITE_API_URL: /api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EarthwayFront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests (if configured)
        run: npm run test --if-present

      - name: Build frontend
        run: npm run build
